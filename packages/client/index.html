<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Objectle</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>Objectle <span id="puzzle-number"></span></h1>
      <p id="reveal-stage"></p>
      <figure id="stage"></figure>
      <form id="guess-form" hidden>
        <input id="guess" list="guess-vocabulary" autocomplete="off" aria-label="Guess" placeholder="Guess the object" />
        <datalist id="guess-vocabulary"></datalist>
        <button type="submit">Guess</button>
      </form>
      <p id="message" role="status"></p>
      <ol id="guesses"></ol>
      <figure id="ghosts" hidden></figure>
      <section id="end-of-game" hidden>
        <h2 id="daily-object"></h2>
        <p id="beat-percentage"></p>
        <ol id="distribution"></ol>
        <h3>Credits</h3>
        <ul id="game-credits"></ul>
      </section>
      <footer><a href="/credits.html">Credits for every model</a></footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
